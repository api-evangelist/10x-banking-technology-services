apis:
- aid: 10x-banking-technology-services:10x-banking-platform-api
  name: 10x Banking Platform API
  description: The REST API surface of the 10x SuperCore platform, covering parties, subscriptions, arrangements,
    transaction/deposit/loan/credit-card products, repayment schedules, interest overrides, cards, statements,
    sweeps, notices, cases, disputes, documents and conversations. The domain vocabulary here is read
    from 10x's own public Postman environment, which is the only first-party machine-readable artifact
    10x publishes; the OpenAPI, the reference and the operation list are all behind the ReadMe login at
    docs.10xbanking.com, and every path on the sandbox host answers 401. The baseURL recorded here is
    the SANDBOX host — it is the only API host 10x names publicly, and it is named by 10x itself. No production
    base URL is published; production appears to be tenant-specific.
  humanURL: https://docs.10xbanking.com/
  baseURL: https://api.sandbox.10xbanking.com
