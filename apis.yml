aid: 10x-banking-technology-services
name: 10x Banking Technology Services
description: '10x Banking Technology Services is a London-headquartered cloud-native core banking platform
  vendor, founded by former Barclays CEO Antony Jenkins, whose SuperCore and "meta core" platform runs
  retail, business, corporate and embedded-finance banking for institutions including Chase UK, Westpac,
  Old Mutual, The Co-operative Bank and West Brom Building Society. The platform is sold as an API-first
  managed core: banks configure products rather than rebuild them, extend the core through the ProductKit
  SDK, APIs, templates, console and CLI tooling in Java, JavaScript, Python, Go, Ruby or .NET, and consume
  real-time event streams. The API contract itself is not public — the developer documentation at docs.10xbanking.com
  redirects every path to a ReadMe login, and the sandbox API host returns a blanket 401 — so this profile
  records the public surface only.'
